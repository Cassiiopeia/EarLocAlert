name: ear_loc_alert
description: "특정 위치에 도착·출발할 때 진동 또는 블루투스 이어폰으로만 알리는 위치 기반 알림 앱"
publish_to: 'none'
# 버전은 version.yml 이 단일 출처다. 직접 수정하지 않는다 (docs/08-OPERATIONS.md)
version: 1.2.38+70
# Dart 3.9+ (docs/02-ARCHITECTURE.md) — 와일드카드 파라미터 등 3.7+ 문법을 쓴다
environment:
  sdk: '>=3.9.0 <4.0.0'
# 의존성은 한 번에 몰아서 추가하지 않는다 — 내부망 환경에서 로컬 검증이 불가능하므로
# CI 실패 시 원인을 좁힐 수 있게 feature 구현 시점에 나눠서 추가한다 (docs/08-OPERATIONS.md)
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  freezed_annotation: ^3.0.0
  # 상태 관리 · DI — Riverpod 으로 통일한다. provider·get_it 병행 금지 (docs/02-ARCHITECTURE.md)
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  # 로컬 저장소 — Drift(SQLite). Hive·Isar 를 쓰지 않는다 (docs/10-DECISIONS.md 003)
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  # 식별자 — 저장 전에 앱이 생성한다 (docs/03-DOMAIN.md)
  uuid: ^4.5.1
  # 라우팅 — Navigator.push 직접 호출 금지 (docs/02-ARCHITECTURE.md)
  go_router: ^14.6.2
  # 권한 — 플랫폼 차이는 data 계층에서 흡수한다 (docs/05-PLATFORM.md)
  permission_handler: ^11.3.1
  # 반응형 치수 — 하드코딩된 px 금지 (docs/04-CONVENTIONS.md)
  flutter_screenutil: ^5.9.3
  # 알림 발화 (docs/03-DOMAIN.md 규칙 5)
  flutter_local_notifications: ^19.5.0
  vibration: ^3.1.3
  # 오디오 — 블루투스 연결 확인 후에만 재생한다 (F3.7)
  audio_session: ^0.1.21
  just_audio: ^0.9.42
  # 광고 — 1차 심사부터 포함한다 (docs/10-DECISIONS.md 009)
  google_mobile_ads: ^5.2.0
  # 단일 설정값 저장 (docs/03-DOMAIN.md 저장소 경계)
  shared_preferences: ^2.5.2
  # 백그라운드 지오펜스 — S-1 선정: OS 네이티브 API 위임 (docs/10-DECISIONS.md 014)
  native_geofence: ^1.2.1
  # 지도 — Google 로 통일한다 (docs/10-DECISIONS.md 008).
  # API 키는 .env 단일 소스에서 네이티브 빌드로 주입된다 (docs/08-OPERATIONS.md)
  google_maps_flutter: ^2.9.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # 아이콘·스플래시 생성기 — 소스는 assets/icon·assets/splash (이슈 #65)
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  build_runner: ^2.4.6
  freezed: ^3.0.0
  drift_dev: ^2.20.0
  riverpod_generator: ^2.6.1
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.1
flutter:
  uses-material-design: true
  assets:
    # 알림음. 이어폰이 연결된 경우에만 재생된다 (F3.7)
    - assets/sounds/alert.wav
# 앱 아이콘 생성: dart run flutter_launcher_icons (이슈 #65)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0D0D0D"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
# 스플래시 생성: dart run flutter_native_splash:create (이슈 #65)
flutter_native_splash:
  color: "#0D0D0D"
  image: assets/splash/splash_logo.png
  android_12:
    color: "#0D0D0D"
    # Android 12+ 는 원형 마스크가 걸린다 — 여백 넓은 판을 따로 쓴다
    image: assets/splash/splash_logo_a12.png
