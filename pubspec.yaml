name: ear_loc_alert
description: "특정 위치에 도착·출발할 때 진동 또는 블루투스 이어폰으로만 알리는 위치 기반 알림 앱"
publish_to: 'none'
# 버전은 version.yml 이 단일 출처다. 직접 수정하지 않는다 (docs/08-OPERATIONS.md)
version: 1.2.23+55
environment:
  sdk: '>=3.0.0 <4.0.0'
# 의존성은 한 번에 몰아서 추가하지 않는다 — 내부망 환경에서 로컬 검증이 불가능하므로
# CI 실패 시 원인을 좁힐 수 있게 feature 구현 시점에 나눠서 추가한다 (docs/08-OPERATIONS.md)
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  freezed_annotation: ^3.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.6
  freezed: ^3.0.0
flutter:
  uses-material-design: true
